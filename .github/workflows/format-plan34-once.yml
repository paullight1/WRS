name: One-shot Plans 3-4 Format

on:
  push:
    branches:
      - prod/plans-01-04
    paths:
      - .github/workflows/format-plan34-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plans-01-04
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format quality-owned source
        run: >-
          npx prettier --write api src/lib src/domain src/services src/infrastructure
          src/components/auth src/components/robot src/components/AppShell.jsx
          "src/screens/{Login,Register,Verify,ForgotPassword,ResetPassword,SecuritySettings,Onboarding,Customize,RobotPassport,Home,MyRobot,More,Profile,Settings,ActiveDeployment}.jsx"
          src/App.jsx tests .github/workflows eslint.config.js playwright.config.js
          vitest.config.js vite.config.js
      - name: Commit deterministic formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-plan34-once.yml
          git add api src/lib src/domain src/services src/infrastructure src/components/auth src/components/robot src/components/AppShell.jsx src/screens src/App.jsx tests .github/workflows eslint.config.js playwright.config.js vitest.config.js vite.config.js
          git commit -m "style: normalize Plan 3-4 server runtime"
          git push origin HEAD:prod/plans-01-04
