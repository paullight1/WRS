# Trigger after workflow registration; self-deletes after deterministic formatting.
name: One-shot Plan 11 Evidence Format

on:
  push:
    branches:
      - prod/plan-11-live-activation
    paths:
      - .github/workflows/finalize-plan11-evidence-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plan-11-live-activation
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Plan 11 evidence scripts
        run: >-
          npx prettier --write
          scripts/plan11/github-governance-probe.mjs
          scripts/plan11/provider-restore-compare.mjs
          scripts/plan11/sensitive-data-staging-drill.mjs
          scripts/plan11/supabase-live-audit.mjs
          scripts/plan11/vercel-staging-rollback-drill.mjs
      - name: Commit formatting and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-plan11-evidence-format-once.yml
          git add scripts/plan11
          git commit -m "style(plan11): format live activation evidence scripts"
          git push origin HEAD:prod/plan-11-live-activation
