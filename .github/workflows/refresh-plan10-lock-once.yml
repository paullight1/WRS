name: One-shot Plan 10 Lockfile

on:
  push:
    branches:
      - prod/plans-05-10
    paths:
      - .github/workflows/refresh-plan10-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plans-05-10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Commit generated lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-plan10-lock-once.yml
          git add package-lock.json
          git commit -m "chore: refresh Plan 10 lockfile"
          git push origin HEAD:prod/plans-05-10
