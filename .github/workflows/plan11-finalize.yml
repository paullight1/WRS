name: Plan 11 One-shot Finalizer

on:
  pull_request:
    paths:
      - .github/workflows/plan11-finalize.yml
      - scripts/evaluate-live-go.mjs
      - scripts/staging-http-preflight.mjs
      - tests/plan11/final-go.contract.test.mjs
      - playwright.staging.config.js

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'prod/plan-11-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize exact Plan 11 files identified by Prettier
        run: >-
          npx prettier --write
          scripts/evaluate-live-go.mjs
          scripts/staging-http-preflight.mjs
          tests/plan11/final-go.contract.test.mjs
          playwright.staging.config.js
      - name: Commit deterministic formatting and remove helper
        run: |
          git rm .github/workflows/plan11-finalize.yml
          if git diff --cached --quiet && git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/evaluate-live-go.mjs scripts/staging-http-preflight.mjs tests/plan11/final-go.contract.test.mjs playwright.staging.config.js
          git commit -m "style(plan11): normalize activation package"
          git push origin HEAD:${{ github.head_ref }}
