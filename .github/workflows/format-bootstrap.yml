name: Plan 2 Format Bootstrap

on:
  push:
    branches:
      - prod/plans-01-04
    paths:
      - .github/workflows/format-bootstrap.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plans-01-04
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: npx prettier --write src/lib src/domain src/services src/infrastructure tests .github/workflows eslint.config.js playwright.config.js vitest.config.js vite.config.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib src/domain src/services src/infrastructure tests .github/workflows eslint.config.js playwright.config.js vitest.config.js vite.config.js
          git commit -m "style: apply Plan 2 formatting baseline"
          git push origin HEAD:prod/plans-01-04
