name: Plan 10 Security and Launch Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, prod/plans-05-10]

permissions:
  contents: read

jobs:
  supply-chain-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run audit
      - run: npm run build
      - run: npm run check:bundle-budget

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y -- --project=desktop-chromium
