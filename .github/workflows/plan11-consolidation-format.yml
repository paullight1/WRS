name: Plan 11 Consolidation Formatter

on:
  push:
    branches:
      - prod/plan-11-consolidation
    paths:
      - .github/workflows/plan11-consolidation-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plan-11-consolidation
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write api/_lib/paystack.js
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/plan11-consolidation-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/paystack.js
          git commit -m "style(plan11): normalize consolidated payment provider"
          git push origin HEAD:prod/plan-11-consolidation
