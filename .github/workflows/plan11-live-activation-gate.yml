name: Plan 11 Live Activation Gate

on:
  pull_request:
  push:
    branches:
      - prod/plan-11-live-activation
      - main
  workflow_dispatch:
    inputs:
      enforce_go:
        description: 'Require every live gate to be PASS'
        required: false
        default: false
        type: boolean
      release_candidate_sha:
        description: 'Exact application commit being promoted; required when enforce_go=true'
        required: false
        type: string
      staging_url:
        description: 'Optional HTTPS staging URL for live probes'
        required: false
        type: string
      run_staging_e2e:
        description: 'Run the deployed-staging public browser suite'
        required: false
        default: false
        type: boolean
      run_staging_lab_vitals:
        description: 'Run mobile lab LCP/CLS regression measurements'
        required: false
        default: false
        type: boolean
      run_paystack_probe:
        description: 'Initialize a synthetic Paystack test-mode transaction'
        required: false
        default: false
        type: boolean
      run_paystack_payout_probe:
        description: 'Create and verify a synthetic Paystack test-mode transfer'
        required: false
        default: false
        type: boolean
      run_sensitive_data_drill:
        description: 'Synthetic staging data lifecycle stage'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - prepare
          - finalize
      data_deletion_request_id:
        description: 'Deletion request ID emitted by prepare; required for finalize'
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/plan11/*.test.mjs
      - run: node scripts/plan11/assert-release-candidate.mjs
      - run: npm run plan11:status

  staging-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.staging_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRS_STAGING_URL: ${{ inputs.staging_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run plan11:staging-probe

  staging-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_e2e && inputs.staging_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRS_E2E_BASE_URL: ${{ inputs.staging_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run plan11:staging-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: plan11-staging-browser-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  staging-lab-vitals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_lab_vitals && inputs.staging_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRS_STAGING_URL: ${{ inputs.staging_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run plan11:staging-lab-vitals | tee plan11-staging-lab-vitals.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan11-staging-lab-vitals
          path: plan11-staging-lab-vitals.json

  paystack-test-mode:
    if: github.event_name == 'workflow_dispatch' && inputs.run_paystack_probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run plan11:paystack-probe | tee plan11-paystack-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan11-paystack-test-mode-probe
          path: plan11-paystack-probe.json

  paystack-payout-test-mode:
    if: github.event_name == 'workflow_dispatch' && inputs.run_paystack_payout_probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/plan11/paystack-payout-probe.mjs | tee plan11-paystack-payout-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan11-paystack-payout-test-mode-probe
          path: plan11-paystack-payout-probe.json

  sensitive-data-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.run_sensitive_data_drill != 'none' && inputs.staging_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRS_STAGING_URL: ${{ inputs.staging_url }}
      WRS_DATA_DRILL_PHASE: ${{ inputs.run_sensitive_data_drill }}
      WRS_DATA_DELETION_REQUEST_ID: ${{ inputs.data_deletion_request_id }}
      WRS_STAGING_TEST_EMAIL: ${{ secrets.WRS_STAGING_TEST_EMAIL }}
      WRS_STAGING_TEST_PASSWORD: ${{ secrets.WRS_STAGING_TEST_PASSWORD }}
      WRS_DATA_SCANNER_SECRET: ${{ secrets.WRS_DATA_SCANNER_SECRET }}
      WRS_DATA_DELETION_SECRET: ${{ secrets.WRS_DATA_DELETION_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/plan11/sensitive-data-staging-drill.mjs "$WRS_DATA_DRILL_PHASE" | tee plan11-sensitive-data.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan11-sensitive-data-${{ inputs.run_sensitive_data_drill }}
          path: plan11-sensitive-data.json

  strict-go:
    if: github.event_name == 'workflow_dispatch' && inputs.enforce_go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRS_EXPECTED_RELEASE_CANDIDATE: ${{ inputs.release_candidate_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate release candidate input
        run: |
          if ! printf '%s' "$WRS_EXPECTED_RELEASE_CANDIDATE" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo 'release_candidate_sha must be a full 40-character commit SHA' >&2
            exit 2
          fi
      - run: node scripts/plan11/assert-release-candidate.mjs
      - run: npm run plan11:gate
