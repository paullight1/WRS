name: Plan 1 Safety Gate

on:
  pull_request:
  push:
    branches:
      - prod/plans-01-04

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Plan 1 safety tests
        run: node --test tests/plan1/*.test.mjs
