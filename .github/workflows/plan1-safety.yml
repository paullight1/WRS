name: Production Hardening Bootstrap

on:
  pull_request:
  push:
    branches:
      - prod/plans-01-04

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Plan 1 and Plan 2 contract tests
        run: node --test tests/plan1/*.test.mjs tests/plan2/*.test.mjs
