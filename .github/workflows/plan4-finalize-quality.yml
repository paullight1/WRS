name: Plan 4 Finalize Quality

on:
  push:
    branches:
      - prod/plans-01-04
    paths:
      - .github/workflows/plan4-finalize-quality.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plans-01-04
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize owned code
        run: npx prettier --write src/lib src/domain src/services src/infrastructure src/components/auth src/components/robot src/components/AppShell.jsx "src/screens/{Login,Register,Verify,ForgotPassword,ResetPassword,SecuritySettings,Onboarding,Customize,RobotPassport,Home,MyRobot,More,Profile,Settings,ActiveDeployment}.jsx" src/App.jsx tests .github/workflows eslint.config.js playwright.config.js vitest.config.js vite.config.js
      - name: Restore read-only gate and remove one-shot workflows
        run: |
          cat > .github/workflows/quality-gate.yml <<'YAML'
          name: WRS Quality Gate

          on:
            pull_request:
            push:
              branches:
                - prod/plans-01-04
                - main

          permissions:
            contents: read

          jobs:
            static:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run lint
                - run: npm run typecheck
                - run: npm run format:check
                - run: npm run test:contracts
                - run: npm run build

            tests:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run test:unit
                - run: npm run test:integration

            e2e:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - run: npm run test:e2e
                - uses: actions/upload-artifact@v4
                  if: failure()
                  with:
                    name: playwright-report
                    path: |
                      playwright-report
                      test-results
                    if-no-files-found: ignore

            security:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run audit
          YAML
          rm -f .github/workflows/plan4-finalize-quality.yml
          rm -f .github/workflows/plan4-quality-cleanup.yml
      - name: Commit deterministic finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Plan 4 baseline already finalized"
            exit 0
          fi
          git commit -m "ci: finalize read-only Plans 3 and 4 quality baseline"
          git push origin HEAD:prod/plans-01-04
