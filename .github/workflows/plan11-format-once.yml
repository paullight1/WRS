name: Plan 11 Format Once

on:
  push:
    branches:
      - prod/plan-11-activation
    paths:
      - scripts/validate-live-env.mjs
      - tests/integration/live-env-preflight.test.mjs
      - tests/plan11/live-infrastructure.contract.test.mjs
      - .github/workflows/plan11-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plan-11-activation
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/validate-live-env.mjs tests/integration/live-env-preflight.test.mjs tests/plan11/live-infrastructure.contract.test.mjs
      - name: Commit deterministic formatting and remove helper
        run: |
          rm .github/workflows/plan11-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-live-env.mjs tests/integration/live-env-preflight.test.mjs tests/plan11/live-infrastructure.contract.test.mjs .github/workflows/plan11-format-once.yml
          git commit -m "style(plan11): normalize activation preflight"
          git push origin HEAD:prod/plan-11-activation
