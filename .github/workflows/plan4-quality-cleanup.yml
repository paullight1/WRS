name: Plan 4 Quality Cleanup

on:
  push:
    branches:
      - prod/plans-01-04
    paths:
      - .github/workflows/plan4-quality-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plans-01-04
      - name: Restore read-only quality gate
        run: |
          cat > .github/workflows/quality-gate.yml <<'YAML'
          name: WRS Quality Gate

          on:
            pull_request:
            push:
              branches:
                - prod/plans-01-04
                - main

          permissions:
            contents: read

          jobs:
            static:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run lint
                - run: npm run typecheck
                - run: npm run format:check
                - run: npm run test:contracts
                - run: npm run build

            tests:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run test:unit
                - run: npm run test:integration

            e2e:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - run: npm run test:e2e
                - uses: actions/upload-artifact@v4
                  if: failure()
                  with:
                    name: playwright-report
                    path: |
                      playwright-report
                      test-results
                    if-no-files-found: ignore

            security:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run audit
          YAML
          rm .github/workflows/plan4-quality-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo "Quality gate already clean"
            exit 0
          fi
          git commit -m "ci: restore read-only Plan 4 quality gate"
          git push origin HEAD:prod/plans-01-04
