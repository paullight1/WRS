# Trigger after workflow registration. Self-deletes after deterministic formatting.
name: One-shot Plan 10 Format

on:
  push:
    branches:
      - prod/plans-05-10
    paths:
      - .github/workflows/finalize-plan10-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plans-05-10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Plan 10 owned surface
        run: >-
          npx prettier --write
          api/_lib/http.js api/_lib/security.js api/_lib/supabase.js api/_lib/telemetry.js
          server/http.js server/supabase.js
          scripts/check-secrets.mjs scripts/check-bundle-budget.mjs
          src/components/AppShell.jsx src/screens/Register.jsx
          tests/e2e/accessibility.spec.js tests/integration/resilience.test.ts tests/unit/security
          tests/plan10
          .github/dependabot.yml .github/workflows/plan10-security-gate.yml .github/workflows/plan10-recovery-gate.yml
          vercel.json performance-budgets.json package.json
      - name: Commit formatting and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-plan10-format-once.yml
          git add api server scripts src tests .github/dependabot.yml .github/workflows/plan10-security-gate.yml .github/workflows/plan10-recovery-gate.yml vercel.json performance-budgets.json package.json
          git commit -m "style: format Plan 10 security launch surface"
          git push origin HEAD:prod/plans-05-10
