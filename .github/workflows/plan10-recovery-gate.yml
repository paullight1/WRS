name: Plan 10 Recovery Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, prod/plans-05-10]

permissions:
  contents: read

jobs:
  postgres-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wrs_recovery_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wrs_recovery_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: wrs_recovery_source
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap Supabase-compatible auth primitives
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create extension if not exists citext;
          create schema if not exists auth;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if;
          end
          $$;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(), email text, phone text, created_at timestamptz not null default now()
          );
          create or replace function auth.uid() returns uuid language sql stable set search_path='' as $$
            select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid
          $$;
          create or replace function auth.role() returns text language sql stable set search_path='' as $$
            select nullif(current_setting('request.jwt.claim.role',true),'')
          $$;
          create or replace function auth.jwt() returns jsonb language sql stable set search_path='' as $$
            select jsonb_build_object('sub',current_setting('request.jwt.claim.sub',true),'role',current_setting('request.jwt.claim.role',true))
          $$;
          grant usage on schema public,auth to anon,authenticated,service_role;
          alter default privileges for role postgres in schema public grant select,insert,update,delete on tables to anon,authenticated,service_role;
          alter default privileges for role postgres in schema public grant usage,select on sequences to anon,authenticated,service_role;
          alter default privileges for role postgres in schema public grant execute on functions to anon,authenticated,service_role;
          SQL
      - name: Apply all WRS migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Seed synthetic recovery record
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id,email,phone) values('00000000-0000-4000-8000-000000000099','restore@example.invalid','+99900000099');
          insert into public.user_profiles(
            user_id,full_name,normalized_email,normalized_phone,status,terms_version,privacy_version,email_verified_at,phone_verified_at
          ) values(
            '00000000-0000-4000-8000-000000000099','Synthetic Restore User','restore@example.invalid','+99900000099','active','test','test',now(),now()
          );
          insert into public.user_settings(user_id,language,currency,timezone)
          values('00000000-0000-4000-8000-000000000099','en','USD','UTC');
          SQL
      - name: Dump and restore into isolated database with PostgreSQL 17 client
        run: |
          set -euo pipefail
          mkdir -p /tmp/wrs-recovery
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v /tmp/wrs-recovery:/backup \
            postgres:17 \
            pg_dump -h 127.0.0.1 -U postgres -d wrs_recovery_source \
              --format=custom --no-owner --no-privileges -f /backup/wrs.dump
          createdb wrs_recovery_restored
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v /tmp/wrs-recovery:/backup \
            postgres:17 \
            pg_restore -h 127.0.0.1 -U postgres \
              --no-owner --no-privileges --exit-on-error \
              -d wrs_recovery_restored /backup/wrs.dump
      - name: Verify restored integrity
        run: |
          set -euo pipefail
          test "$(psql -d wrs_recovery_restored -Atc "select count(*) from public.user_profiles where normalized_email='restore@example.invalid'")" = "1"
          test "$(psql -d wrs_recovery_restored -Atc "select count(*) from public.user_settings where user_id='00000000-0000-4000-8000-000000000099'")" = "1"
          psql -d wrs_recovery_restored -v ON_ERROR_STOP=1 -c "select to_regclass('public.ledger_entries'),to_regclass('public.data_deletion_requests'),to_regclass('public.operations_audit_events');"
