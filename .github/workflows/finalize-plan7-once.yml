name: One-shot Plan 7 Finalize

on:
  push:
    branches:
      - prod/plans-05-10
    paths:
      - .github/workflows/finalize-plan7-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: prod/plans-05-10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove dead demo variable
        run: sed -i "/const t = tone(STATUS_TONE\[d.status\] || 'tertiary')/d" src/screens/Deploy.jsx
      - name: Format Plan 7 owned surface
        run: >-
          npx prettier --write
          api/_lib/deployment.js api/_lib/internalAuth.js api/data/delete/process.js api/deployments
          server/deployment.js src/domain/deployment src/services/deployment src/infrastructure/deployment
          src/screens/Deploy.jsx src/screens/DeploymentDetails.jsx src/screens/ActiveDeployment.jsx
          src/screens/DeployProduction.jsx src/screens/DeploymentDetailsProduction.jsx src/screens/ActiveDeploymentProduction.jsx
          src/App.jsx tests/plan7 tests/unit/deployment.test.ts package.json eslint.config.js .github/workflows/plan7-database-gate.yml
      - name: Commit fixes and remove finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-plan7-once.yml
          git add api server src tests package.json eslint.config.js .github/workflows/plan7-database-gate.yml
          git commit -m "style: finalize Plan 7 deployment surface"
          git push origin HEAD:prod/plans-05-10
